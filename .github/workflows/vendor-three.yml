name: Vendor Three.js Runtime

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vendor-three.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download pinned Three.js runtime
        run: |
          mkdir -p vendor/addons/controls
          curl -fL --retry 4 --retry-delay 2 "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" -o vendor/three.module.js
          curl -fL --retry 4 --retry-delay 2 "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js" -o vendor/addons/controls/OrbitControls.js
          test -s vendor/three.module.js
          test -s vendor/addons/controls/OrbitControls.js
      - name: Commit vendored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three.module.js vendor/addons/controls/OrbitControls.js
          if git diff --cached --quiet; then
            echo "Vendored runtime already current."
          else
            git commit -m "build: vendor pinned Three.js runtime"
            git push
          fi
