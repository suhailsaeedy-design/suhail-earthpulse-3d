name: Build Real EarthPulse Reels Video

on:
  push:
    branches: ["main"]
    paths:
      - "tools/promo/record-reels.mjs"
      - ".github/workflows/earthpulse-reels-video.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthpulse-main-writes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout EarthPulse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser recorder
        run: |
          npm init -y >/dev/null 2>&1
          npm install -D playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record real code and live website
        run: |
          rm -rf promo/raw
          mkdir -p promo/raw
          node tools/promo/record-reels.mjs
          RAW_VIDEO="$(find promo/raw -type f -name '*.webm' | head -n 1)"
          test -n "$RAW_VIDEO"
          test -s "$RAW_VIDEO"
          echo "RAW_VIDEO=$RAW_VIDEO" >> "$GITHUB_ENV"

      - name: Encode 9x16 Reels master with safe margins
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          mkdir -p promo
          ffmpeg -y             -i "$RAW_VIDEO"             -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000"             -map 0:v:0 -map 1:a:0             -vf "scale=800:1440:flags=lanczos,pad=1080:1920:140:240:color=0x030611,setsar=1,fps=30,format=yuv420p"             -c:v libx264 -profile:v high -level:v 4.2 -preset medium -crf 20             -maxrate 6000k -bufsize 12000k             -c:a aac -b:a 96k -ar 48000             -shortest -movflags +faststart             -metadata title="EarthPulse 3D — Reels Vertical Demo"             -metadata comment="Real source code and live website capture by Suhail Labs"             promo/earthpulse-3d-reels-1080x1920.mp4

          test -s promo/earthpulse-3d-reels-1080x1920.mp4
          ffprobe -v error             -show_entries stream=width,height,r_frame_rate             -show_entries format=duration,size             -of default=noprint_wrappers=1             promo/earthpulse-3d-reels-1080x1920.mp4 | tee promo/earthpulse-3d-reels-info.txt

          grep -q "width=1080" promo/earthpulse-3d-reels-info.txt
          grep -q "height=1920" promo/earthpulse-3d-reels-info.txt

      - name: Upload finished video artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthpulse-3d-reels-1080x1920
          path: |
            promo/earthpulse-3d-reels-1080x1920.mp4
            promo/earthpulse-3d-reels-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish finished video in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/earthpulse-3d-reels-1080x1920.mp4 promo/earthpulse-3d-reels-info.txt
          if git diff --cached --quiet; then
            echo "Promo video already current."
            exit 0
          fi
          git commit -m "promo: publish 1080x1920 EarthPulse Reels video"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish promo video after retries."
          exit 1
