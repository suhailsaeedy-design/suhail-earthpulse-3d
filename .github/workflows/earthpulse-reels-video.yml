name: Build Real EarthPulse Reels Video

on:
  push:
    branches: ["main"]
    paths:
      - "tools/promo/record-reels.mjs"
      - ".github/workflows/earthpulse-reels-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthpulse-reels-render
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout EarthPulse
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser recorder
        run: |
          npm init -y >/dev/null 2>&1
          npm install -D playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record real code and real live website modes
        run: |
          rm -rf promo/raw
          mkdir -p promo/raw
          node tools/promo/record-reels.mjs
          test -s promo/raw/timings.json
          for name in code earth satellite system galaxy about finale; do
            test -s "promo/raw/$name.webm"
          done
          cat promo/raw/timings.json

      - name: Encode exact 1080x1920 Reels master with safe margins
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          mkdir -p promo/raw/encoded promo

          python3 - <<'PY'
          import json, pathlib, subprocess

          root=pathlib.Path('promo/raw')
          encoded=root/'encoded'
          encoded.mkdir(parents=True,exist_ok=True)
          items=json.load(open(root/'timings.json',encoding='utf-8'))
          concat=[]

          for item in items:
              name=item['name']
              trim=str(item['trim'])
              duration=str(item['duration'])
              src=root/f'{name}.webm'
              out=encoded/f'{name}.mp4'
              cmd=[
                  'ffmpeg','-loglevel','error','-y',
                  '-ss',trim,'-t',duration,'-i',str(src),
                  '-vf','scale=800:1440:flags=lanczos,pad=1080:1920:140:240:color=0x030611,setsar=1,fps=30,format=yuv420p',
                  '-an',
                  '-c:v','libx264','-profile:v','high','-level:v','4.2','-preset','medium','-crf','20',
                  '-maxrate','6000k','-bufsize','12000k',
                  str(out)
              ]
              print('ENCODE',name,'trim',trim,'duration',duration)
              subprocess.run(cmd,check=True)
              concat.append(f"file '{out.resolve()}'")

          (root/'concat.txt').write_text('\n'.join(concat)+'\n',encoding='utf-8')
          PY

          ffmpeg -loglevel error -y             -f concat -safe 0 -i promo/raw/concat.txt             -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000"             -map 0:v:0 -map 1:a:0             -c:v copy             -c:a aac -b:a 96k -ar 48000             -shortest -movflags +faststart             -metadata title="EarthPulse 3D — Reels Vertical Demo"             -metadata comment="Real source code and live website capture by Suhail Labs"             promo/earthpulse-3d-reels-1080x1920.mp4

          test -s promo/earthpulse-3d-reels-1080x1920.mp4
          ffprobe -v error             -show_entries stream=width,height,r_frame_rate             -show_entries format=duration,size             -of default=noprint_wrappers=1             promo/earthpulse-3d-reels-1080x1920.mp4 | tee promo/earthpulse-3d-reels-info.txt

          grep -q "width=1080" promo/earthpulse-3d-reels-info.txt
          grep -q "height=1920" promo/earthpulse-3d-reels-info.txt

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: earthpulse-3d-reels-1080x1920
          path: |
            promo/earthpulse-3d-reels-1080x1920.mp4
            promo/earthpulse-3d-reels-info.txt
            promo/raw/timings.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
