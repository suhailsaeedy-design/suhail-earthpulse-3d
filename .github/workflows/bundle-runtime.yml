name: Build iPhone-Compatible Runtime

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "vendor/**"
      - ".github/workflows/bundle-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthpulse-main-writes
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build single browser bundle
        run: |
          npm install --no-save esbuild@0.24.2 leaflet@1.9.4
          npx esbuild src/main.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=safari14,ios14 \
            --outfile=app.bundle.js \
            --loader:.png=file \
            --asset-names=assets/[name]-[hash] \
            --minify \
            --legal-comments=none
          test -s app.bundle.js
          test -s app.bundle.css
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.bundle.js app.bundle.css assets
          if git diff --cached --quiet; then
            echo "Bundle already current."
          else
            git commit -m "build: refresh iPhone-compatible runtime bundle"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Unable to push bundled runtime after retries."
            exit 1
          fi

# runtime refresh marker: selector-fix

# rebuild marker: satellite-selector-fix

