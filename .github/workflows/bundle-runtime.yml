name: Build iPhone-Compatible Runtime

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "vendor/**"
      - ".github/workflows/bundle-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build single browser bundle
        run: |
          npm install --no-save esbuild@0.24.2 leaflet@1.9.4
          npx esbuild src/main.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=safari14,ios14 \
            --outfile=app.bundle.js \
            --minify \
            --legal-comments=none
          test -s app.bundle.js
          test -s app.bundle.css
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.bundle.js app.bundle.css
          if git diff --cached --quiet; then
            echo "Bundle already current."
          else
            git commit -m "build: refresh iPhone-compatible runtime bundle"
            git push
          fi

# runtime refresh marker: selector-fix
