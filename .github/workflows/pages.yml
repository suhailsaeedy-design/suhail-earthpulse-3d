name: EarthPulse 3D Quality Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: |
          node --check src/data.js
          node --check src/api.js
          node --check src/scene.js
          node --check src/main.js
      - name: Validate required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s favicon.svg
