name: EarthPulse 3D Quality Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: |
          node --check src/data.js
          node --check src/api.js
          node --check src/scene.js
          node --check src/main.js
      - name: Validate required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s favicon.svg
          test -s sw.js
          test -s docs/SOCIAL_VIDEO_PLAN.md
      - name: Validate EarthPulse feature wiring
        run: |
          grep -q 'data-mode="system"' index.html
          grep -q 'id="planetCard"' index.html
          grep -q 'export const PLANETS' src/data.js
          grep -q 'buildSolarSystem()' src/scene.js
          grep -q 'earthpulse:planet' src/main.js
          grep -q 'id="shareButton"' index.html
          grep -q 'id="tourButton"' index.html
          grep -q 'performanceTier' src/scene.js
          test -s app.bundle.js
          grep -q 'app.bundle.js?v=realistic-v2' index.html
          grep -q '__earthpulseStarted' src/main.js
          grep -q 'earthpulseShowBootError' index.html
      - name: Validate iPhone module compatibility
        run: |
          grep -q "../vendor/three.module.js" src/scene.js
          grep -q "../../three.module.js" vendor/addons/controls/OrbitControls.js
          if grep -q 'type="importmap"' index.html; then
            echo "Import maps are intentionally disabled for embedded iPhone webview compatibility."
            exit 1
          fi
      - name: Validate realistic v2 assets
        run: |
          test -s app.bundle.css
          test -s src/satellite.js
          test -s public/textures/earth-day.jpg
          test -s public/textures/earth-night.jpg
          test -s public/textures/earth-clouds.jpg
          test -s public/textures/moon.jpg
          test -s public/textures/saturn-ring.png
          test -s public/textures/ATTRIBUTION.txt
          grep -q 'id="satelliteShell"' index.html
          grep -q 'SatelliteExplorer' src/main.js
          grep -q 'BlueMarble_NextGeneration' src/satellite.js
          grep -q 'VIIRS_SNPP_CorrectedReflectance_TrueColor' src/satellite.js
          grep -q 'export const MOON' src/data.js
          grep -q 'export const GALAXIES' src/data.js
          grep -q 'pointerGesture' src/scene.js
